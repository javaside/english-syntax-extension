name: 功能建议
description: 提出一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 请先描述实际遇到的困难，而不是直接给方案——这样更容易找到更好的解法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案

  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true

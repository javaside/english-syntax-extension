name: 问题报告
description: Chrome 扩展或 IntelliJ 插件没有按预期工作
labels: ["bug"]
body:
  - type: dropdown
    id: runtime
    attributes:
      label: 哪个运行时出的问题
      options:
        - Chrome 扩展
        - IntelliJ 插件（IDEA Markdown 预览）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: Chrome 扩展见 chrome://extensions；IntelliJ 插件见 Settings → Plugins
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: 运行环境
      description: Chrome 扩展填 Chrome 版本（chrome://version 第一行）；IntelliJ 插件填 IDEA 版本（Help → About）
      placeholder: "Chrome 138 / IDEA 2025.1.1"

  - type: dropdown
    id: endpoint
    attributes:
      label: 模型端点类型
      options:
        - 本地 Ollama
        - DeepSeek
        - OpenAI
        - 其他 OpenAI 兼容服务
        - 无（纯缓存模式）
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 模型名
      placeholder: "qwen3.5:9b / deepseek-v4-flash / ..."

  - type: textarea
    id: error
    attributes:
      label: 卡片上显示的错误码
      description: |
        解析失败的卡片会显示形如 `REQUEST_TIMEOUT：...` 的红色文字。
        **这一条是最有效的定位信息**，能直接指出是哪一层出的问题，请务必贴上。
      render: text

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: Chrome 扩展尽量给出一个公开可访问的页面地址；IntelliJ 插件给出一小段可复现的 Markdown
      placeholder: |
        1. 打开 ...
        2. 点击扩展图标 / Tools → 句法学习
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果

  - type: textarea
    id: console
    attributes:
      label: 控制台 / IDE 日志（可选）
      description: |
        Chrome 扩展：Service Worker 日志见 chrome://extensions →「检查视图 service worker」。
        IntelliJ 插件：idea.log 见 Help → Show Log in Finder/Explorer。
        **贴之前请确认里面没有你的 API Key。**
      render: shell

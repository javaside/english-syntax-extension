name: Release

on:
  push:
    tags: ["v*"]

# 只需要写 Release，不给多余权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome-plugin/package-lock.json

      - run: npm ci

      # tag 与 manifest 版本对不上就别发——发出去再改比现在失败贵得多
      - name: 校验 tag 与 manifest 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PKG"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PKG" ]; then
            echo "版本不一致，终止发布"
            exit 1
          fi

      - run: npm test

      - name: 打包扩展
        run: npm run package

      # 只取本版本那一节并补上安装说明；整个 CHANGELOG 当正文会把历史版本一起贴出去
      - name: 生成 Release 说明
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" RELEASE_NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: chrome-plugin/release/*.zip
          body_path: chrome-plugin/RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true

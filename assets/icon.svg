<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="英语句法伴读">
  <!--
    学习卡片的视觉核心是"英文成分 + 彩色角色条 + 中文译文"三层对齐。
    图标只保留这个骨架:两行错落的成分条，配色直接取自 learning-block 的
    ROLE_COLORS（主语蓝 / 谓语红 / 宾语绿 / 状语橙），下方一条灰色译文条。
    刻意不放字母或汉字——16px 下任何文字都会糊成一团。
  -->
  <rect width="128" height="128" rx="28" fill="#1c1c1e"/>
  <g>
    <rect x="24" y="38" width="34" height="12" rx="6" fill="#2563eb"/>
    <rect x="64" y="38" width="20" height="12" rx="6" fill="#dc2626"/>
    <rect x="90" y="38" width="14" height="12" rx="6" fill="#059669"/>
  </g>
  <g>
    <rect x="24" y="60" width="22" height="12" rx="6" fill="#d97706"/>
    <rect x="52" y="60" width="30" height="12" rx="6" fill="#7c3aed"/>
    <rect x="88" y="60" width="16" height="12" rx="6" fill="#0d9488"/>
  </g>
  <rect x="24" y="84" width="80" height="10" rx="5" fill="#6b7280"/>
</svg>
